<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberScore Admin</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html"><img src="assets/logo.svg"><b>Cyber<span>Score</span></b></a><a href="dashboard.html">Dashboard</a></header><main class="page"><div class="tag">ADMIN PUBLISHER</div><h1>Publish Cyber News</h1><p class="lead">For authorized CyberScore administrators. Create daily awareness articles and publish them to the public news hub.</p><form class="form-card admin-editor" id="newsForm"><input id="title" required placeholder="Article title"><input id="category" required placeholder="Category e.g. Threat Alert"><input id="excerpt" required maxlength="300" placeholder="Short excerpt"><textarea id="body" required rows="10" placeholder="Article body"></textarea><button class="btn">Publish article →</button><p id="msg"></p></form></main><script src="config.js"></script><script src="app.js"></script><script>newsForm.onsubmit=async e=>{e.preventDefault();try{await api('/news',{method:'POST',body:JSON.stringify({title:title.value,category:category.value,excerpt:excerpt.value,body:body.value})});msg.textContent='Published successfully.';newsForm.reset()}catch(e){msg.textContent=e.message}}</script></body></html>
